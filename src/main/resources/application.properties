spring.application.name=student
server.port=8080

# -------------------------------------------------------------
# In-memory H2 Database Configuration (Ready to use out-of-the-box)
# -------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:studentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Web Console (Access at: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------
# Optional: MySQL Database Configuration
# If you want to use MySQL instead of H2, uncomment below and comment H2 settings
# -------------------------------------------------------------
